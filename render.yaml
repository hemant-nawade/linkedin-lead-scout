# One-click deploy on Render: New → Blueprint → pick this repo
services:
  - type: web
    name: linkedin-lead-scout
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: leadscout-db, property: connectionString }
      - key: SECRET_KEY
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: BASE_URL
        sync: false   # e.g. https://linkedin-lead-scout.onrender.com
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
databases:
  - name: leadscout-db
    plan: free
